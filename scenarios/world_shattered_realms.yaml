# ══════════════════════════════════════════════════════════════════════
# DnD World Builder — World Definition Schema
# ══════════════════════════════════════════════════════════════════════
#
# The world file defines the scenario's overall structure:
#   - Which biome blocks exist and where they sit in the grid
#   - The world quest / main storyline
#   - Player spawn configuration
#   - Shared entities (players) that persist across blocks
#
# Biome blocks are defined in separate biome_*.yaml files.
# This file references them by ID and places them on the world grid.
#
# ══════════════════════════════════════════════════════════════════════

world:
  id: "shattered_realms"
  name: "The Shattered Realms"
  author: "DnD World Builder Demo"
  version: "1.0"
  description: >
    A once-unified kingdom torn apart by a corrupted artifact.
    At the center sits the Obsidian Citadel where the Dark Sovereign
    channels the artifact's power. The surrounding lands have been
    twisted into hostile biomes, each guarded by a lieutenant.
    Adventurers arrive at the outer edges and must fight inward.

  grid_size: [3, 3]
  block_size: [20, 20]

  layout:
    - ["mountain_pass",  "blighted_crossing", "frozen_wastes"]
    - ["dark_forest",    "obsidian_citadel",  "scorched_sands"]
    - ["millhaven",      "sunken_swamp",      "crystal_caves"]

  biome_files:
    mountain_pass:      "biome_mountain_pass.yaml"
    blighted_crossing:  "biome_blighted_crossing.yaml"
    frozen_wastes:      "biome_frozen_wastes.yaml"
    dark_forest:        "biome_dark_forest.yaml"
    obsidian_citadel:   "biome_obsidian_citadel.yaml"
    scorched_sands:     "biome_scorched_sands.yaml"
    millhaven:          "biome_millhaven.yaml"
    sunken_swamp:       "biome_sunken_swamp.yaml"
    crystal_caves:      "biome_crystal_caves.yaml"

  difficulty_map:
    - [2, 3, 2]
    - [3, 5, 3]
    - [1, 2, 2]


players:
  spawn_biome: "millhaven"
  spawn_zone: "town_square"

  characters:
    - name: "Fighter"
      entity_type: "player"
      stats:
        str: 16
        dex: 12
        con: 14
        int: 10
        wis: 12
        cha: 8
        ac: 16
        hp: 34
        max_hp: 34
        speed: 30
      inventory: ["Longsword", "Shield", "Chain Mail"]
      portraits:
        needed: true
        style: "humanoid"
        prompt_base: >
          human male warrior, heavy plate armor with scratches and dents,
          determined face, short brown hair, strong square jaw, stubble,
          bust shot, painterly high fantasy, dark moody background
        health_states:
          healthy:
            output: "assets/portraits/players/fighter_healthy.png"
            status: "pending"
          wounded:
            prompt_mod: "scratches on cheeks, tired strained expression, sweat on brow, dirt on face"
            denoise: 0.45
            output: "assets/portraits/players/fighter_wounded.png"
            status: "pending"
          bloodied:
            prompt_mod: "blood running down face, deep cut on forehead, pained grimace, bruised jaw, red around eyes"
            denoise: 0.45
            output: "assets/portraits/players/fighter_bloodied.png"
            status: "pending"
          critical:
            prompt_mod: "covered in blood and dirt, deep gashes on face, swollen shut eye, bruised jaw, exhausted dying expression"
            denoise: 0.60
            output: "assets/portraits/players/fighter_critical.png"
            status: "pending"
      voice:
        preset: "grizzled_veteran"
        reference_audio: "core/audio/voice_seeds/grizzled_veteran.wav"
      dialogue:
        combat:
          - "Hold the line!"
