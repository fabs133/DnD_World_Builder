world_quest:
  id: "shatter_the_sovereign"
  name: "Shatter the Sovereign"
  description: >
    Journey to the heart of the Shattered Realms and destroy the
    corrupted artifact that empowers the Dark Sovereign.
  objectives:
    - "Explore the outer biomes and grow stronger"
    - "Defeat the lieutenants guarding the inner ring"
    - "Breach the Obsidian Citadel"
    - "Confront and defeat the Dark Sovereign"
  boss:
    name: "The Dark Sovereign"
    biome: "obsidian_citadel"
    zone: "throne_room"


